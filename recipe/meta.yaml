{% set version = "12.2.0" %}

package:
  name: mermaid-cli
  version: {{ version }}

source:
  url: https://registry.npmjs.org/@mermaid-js/mermaid-cli/-/mermaid-cli-{{ version }}.tgz
  sha256: 5aea6d89f3c54cfdff969430e1bcdc0212459806d74fd450d4a36d3144869a3b

build:
  number: 0

requirements:
  build:
    - nodejs
    - pnpm
  host:
    - nodejs
    - pnpm
    - pnpm-licenses >=2.1.0
  run:
    - nodejs

test:
  commands:
    - mmdc --version
    - mmdc --help

about:
  home: https://github.com/mermaid-js/mermaid-cli
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: 'Command-line interface for Mermaid'

extra:
  recipe-maintainers:
    - ajaypnair09
