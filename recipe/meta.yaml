{% set version = "11.17.0" %}

package:
  name: mermaid-cli
  version: {{ version }}

source:
  url: https://registry.npmjs.org/@mermaid-js/mermaid-cli/-/mermaid-cli-{{ version }}.tgz
  sha256: 23f2c2722262d98347cf979da6d88bc8693eef2cd8798a38ac393a7f006938a0

build:
  number: 0

requirements:
  build:
    - nodejs
    - pnpm
  host:
    - nodejs
    - pnpm
    - pnpm-licenses >=2.1.0
  run:
    - nodejs

test:
  commands:
    - mmdc --version
    - mmdc --help

about:
  home: https://github.com/mermaid-js/mermaid-cli
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: 'Command-line interface for Mermaid'

extra:
  recipe-maintainers:
    - ajaypnair09
